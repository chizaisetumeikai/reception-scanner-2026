<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no"
  >

  <title>
    地方議会活性化シンポジウム2026 受付
  </title>


  <!-- QRコード読取ライブラリ -->
  <script
    src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"
  ></script>


  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
    }


    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        sans-serif;

      color: #fff;
    }


    .container {
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
      padding: 20px;
    }


    h1 {
      margin: 5px 0 15px;
      font-size: 32px;
    }


    .guide {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 18px;
    }


    #reader {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;

      overflow: hidden;

      border-radius: 16px;

      background: #000;
    }


    #status {
      margin-top: 20px;

      min-height: 35px;

      font-size: 21px;
      font-weight: bold;
    }


    #cameraButton {
      margin-top: 20px;

      padding: 12px 28px;

      font-size: 16px;

      border: none;
      border-radius: 8px;

      background: #444;
      color: white;
    }


    /*
     * =====================================
     * 本人確認・受付完了オーバーレイ
     * =====================================
     */
    #overlay {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 1000;

      background: #f4f5f7;

      color: #111;

      align-items: center;
      justify-content: center;

      padding: 20px;

      box-sizing: border-box;
    }


    .overlayCard {
      box-sizing: border-box;

      width: 92%;
      max-width: 720px;

      background: #fff;

      border-radius: 22px;

      padding: 45px 35px;

      text-align: center;

      box-shadow:
        0 5px 25px
        rgba(0, 0, 0, 0.15);
    }


    #overlayTitle {
      font-size: 36px;
      font-weight: bold;
      line-height: 1.5;

      margin-bottom: 32px;
    }


    #participantOrganization {
      font-size: 24px;

      margin-bottom: 12px;
    }


    #participantName {
      font-size: 36px;
      font-weight: bold;

      margin-bottom: 30px;
    }


    .seatLabel {
      font-size: 21px;

      margin-bottom: 5px;
    }


    #participantSeat {
      font-size: 54px;
      font-weight: bold;

      margin-bottom: 35px;
    }


    #buttonRow {
      display: none;

      width: 100%;

      gap: 16px;
    }


    #yesButton,
    #noButton {
      flex: 1;

      padding: 22px 10px;

      border: none;
      border-radius: 12px;

      font-size: 28px;
      font-weight: bold;

      cursor: pointer;
    }


    /*
     * 左：はい
     */
    #yesButton {
      background: #1976d2;
      color: #fff;
    }


    /*
     * 右：いいえ
     */
    #noButton {
      background: #e5e7eb;
      color: #222;
    }


    #yesButton:disabled,
    #noButton:disabled {
      opacity: 0.55;
    }


    #overlayMessage {
      min-height: 28px;

      margin-top: 18px;

      font-size: 19px;
      font-weight: bold;
    }


    /*
     * Apps Scriptとの裏側通信用
     *
     * 画面には一切表示しない
     */
    #bridgeFrame,
    #bridgeForm {
      display: none;
    }

  </style>

</head>


<body>


<div class="container">

  <h1>
    地方議会活性化シンポジウム2026
  </h1>


  <div class="guide">
    参加証のQRコードを<br>
    カメラにかざしてください
  </div>


  <div id="reader"></div>


  <div id="status">
    カメラを起動しています…
  </div>


  <button
    id="cameraButton"
    type="button"
  >
    カメラ切替
  </button>

</div>



<!--
  本人確認・受付結果
-->
<div id="overlay">

  <div class="overlayCard">

    <div id="overlayTitle">
    </div>


    <div id="participantOrganization">
    </div>


    <div id="participantName">
    </div>


    <div class="seatLabel">
      座席番号
    </div>


    <div id="participantSeat">
    </div>


    <div id="buttonRow">

      <!-- 左：はい -->
      <button
        id="yesButton"
        type="button"
      >
        はい
      </button>


      <!-- 右：いいえ -->
      <button
        id="noButton"
        type="button"
      >
        いいえ
      </button>

    </div>


    <div id="overlayMessage">
    </div>

  </div>

</div>



<!--
  Apps Scriptとの通信専用iframe
-->
<iframe
  id="bridgeFrame"
  name="kioskBridgeFrame"
  src="about:blank"
></iframe>



<!--
  受付確定POST専用
-->
<form
  id="bridgeForm"
  method="post"
  target="kioskBridgeFrame"
>

  <input
    id="bridgeAction"
    name="action"
    type="hidden"
    value="checkin"
  >


  <input
    id="bridgeToken"
    name="t"
    type="hidden"
    value=""
  >

</form>



<script>


/*
 * =====================================
 * GitHub Scanner専用
 * Apps Script公開Bridge URL
 *
 * ★重要
 *
 * 「全員」で公開した
 * 新しいWebアプリの
 * /exec URLを設定してください。
 *
 * OMC限定WebアプリURLではありません。
 * /dev でもありません。
 * =====================================
 */
const KIOSK_BRIDGE_URL =
  'https://script.google.com/macros/s/AKfycbzmxnS1vopIwV5FkjDcMN_QhjGm2zM0JBUTWqmZu1vgmTx6s1hjgEv6LREjD9WhYTnJaQ/exec';



let scanner =
  null;


let busy =
  false;


/*
 * 現在処理中の参加者
 */
let currentToken =
  '';


/*
 * preview / checkin
 */
let pendingMode =
  '';


/*
 * 通信タイムアウト
 */
let bridgeTimeoutId =
  null;


/*
 * 参加者側を向く
 * インカメラから開始
 */
let facingMode =
  'user';



const statusElement =
  document.getElementById(
    'status'
  );


const overlay =
  document.getElementById(
    'overlay'
  );


const overlayTitle =
  document.getElementById(
    'overlayTitle'
  );


const participantOrganization =
  document.getElementById(
    'participantOrganization'
  );


const participantName =
  document.getElementById(
    'participantName'
  );


const participantSeat =
  document.getElementById(
    'participantSeat'
  );


const buttonRow =
  document.getElementById(
    'buttonRow'
  );


const yesButton =
  document.getElementById(
    'yesButton'
  );


const noButton =
  document.getElementById(
    'noButton'
  );


const overlayMessage =
  document.getElementById(
    'overlayMessage'
  );


const bridgeFrame =
  document.getElementById(
    'bridgeFrame'
  );


const bridgeForm =
  document.getElementById(
    'bridgeForm'
  );


const bridgeToken =
  document.getElementById(
    'bridgeToken'
  );



/**
 * QRコードから
 * 受付トークンだけ取得
 */
function extractReceptionToken(
  decodedText
) {

  const text =
    String(
      decodedText || ''
    ).trim();


  /*
   * 32桁トークンそのもの
   */
  if (
    /^[a-f0-9]{32}$/i.test(
      text
    )
  ) {

    return text;
  }


  /*
   * URL型QR
   *
   * ?t=受付トークン
   */
  try {

    const url =
      new URL(
        text
      );


    const token =
      url.searchParams.get(
        't'
      ) || '';


    if (
      /^[a-f0-9]{32}$/i.test(
        token
      )
    ) {

      return token;
    }


    return '';


  } catch (error) {

    return '';
  }
}



/**
 * QRコード読取成功
 */
function onScanSuccess(
  decodedText
) {

  /*
   * 1人処理中は
   * 次のQRを読まない
   */
  if (busy) {
    return;
  }


  const token =
    extractReceptionToken(
      decodedText
    );


  /*
   * 参加証ではないQR
   */
  if (!token) {

    busy =
      true;


    statusElement.textContent =
      'このQRコードは参加証ではありません。';


    window.setTimeout(
      function() {

        busy =
          false;


        statusElement.textContent =
          '参加証のQRコードをかざしてください。';

      },
      1500
    );


    return;
  }


  /*
   * ここから参加者1人分の処理開始
   */
  busy =
    true;


  currentToken =
    token;


  statusElement.textContent =
    '読み取りました。参加者情報を確認しています…';


  /*
   * カメラそのものは停止しない。
   *
   * QR解析だけ一時停止する。
   */
  try {

    if (scanner) {

      scanner.pause(
        true
      );
    }

  } catch (error) {

    console.error(
      'Scanner pause:',
      error
    );
  }


  /*
   * Apps Scriptから
   * 氏名・所属・座席番号等を取得
   */
  requestParticipantPreview(
    token
  );
}



/**
 * 参加者情報取得
 */
function requestParticipantPreview(
  token
) {

  pendingMode =
    'preview';


  startBridgeTimeout(
    '参加者情報の取得に時間がかかっています。'
  );


  const url =
    KIOSK_BRIDGE_URL +
    '?bridge=preview' +
    '&t=' +
    encodeURIComponent(
      token
    ) +
    '&_=' +
    Date.now();


  bridgeFrame.src =
    url;
}



/**
 * 「はい」
 *
 * ここで初めて
 * Apps Scriptへ受付確定を送る
 */
function confirmReception() {

  if (
    pendingMode === 'checkin'
  ) {

    return;
  }


  pendingMode =
    'checkin';


  yesButton.disabled =
    true;


  noButton.disabled =
    true;


  yesButton.textContent =
    '受付処理中…';


  overlayMessage.textContent =
    '受付処理を行っています。';


  startBridgeTimeout(
    '受付処理に時間がかかっています。'
  );


  bridgeToken.value =
    currentToken;


  /*
   * POST先
   */
  bridgeForm.action =
    KIOSK_BRIDGE_URL +
    '?_=' +
    Date.now();


  /*
   * 非表示iframeへPOST
   *
   * GitHub画面自体は
   * 一切移動しない
   */
  bridgeForm.submit();
}



/**
 * 「いいえ」
 *
 * 受付処理は行わない
 */
function cancelReception() {

  if (
    pendingMode === 'checkin'
  ) {

    return;
  }


  yesButton.disabled =
    true;


  noButton.disabled =
    true;


  overlayMessage.textContent =
    '読み取り画面へ戻ります…';


  window.setTimeout(
    function() {

      resumeScanner();

    },
    300
  );
}



/**
 * Apps Scriptから
 * postMessageで返ってきた結果
 */
function receiveBridgeMessage(
  event
) {

  /*
   * Apps Script HTML Serviceは
   * googleusercontent.com側から
   * 実行される場合がある。
   */
  const allowedOrigin =
    event.origin ===
      'https://script.google.com' ||

    event.origin ===
      'https://script.googleusercontent.com' ||

    /^https:\/\/[^/]+\.googleusercontent\.com$/i
      .test(
        event.origin
      );


  if (!allowedOrigin) {

    return;
  }


  const data =
    event.data;


  if (
    !data ||
    data.source !==
      'reception-kiosk-2026'
  ) {

    return;
  }


  /*
   * 古い応答等を無視
   */
  if (
    data.type !==
    pendingMode
  ) {

    return;
  }


  clearBridgeTimeout();


  const result =
    data.result || {
      ok: false,
      message:
        '処理結果を取得できませんでした。'
    };


  /*
   * =====================================
   * 参加者情報取得結果
   * =====================================
   */
  if (
    data.type ===
    'preview'
  ) {

    handlePreviewResult(
      result
    );


    return;
  }


  /*
   * =====================================
   * 受付確定結果
   * =====================================
   */
  if (
    data.type ===
    'checkin'
  ) {

    handleCheckInResult(
      result
    );
  }
}



/**
 * 参加者情報取得後
 */
function handlePreviewResult(
  result
) {

  pendingMode =
    '';


  /*
   * 無効なQRなど
   */
  if (
    !result ||
    !result.ok
  ) {

    showTemporaryMessage(
      result &&
      result.message
        ? result.message
        : '参加者情報を取得できませんでした。',
      3500
    );


    return;
  }


  /*
   * 既に受付済み
   */
  if (
    result.alreadyChecked
  ) {

    showParticipantResult(
      '既に受付しております',
      result,
      false
    );


    window.setTimeout(
      function() {

        resumeScanner();

      },
      3000
    );


    return;
  }


  /*
   * 本人確認
   */
  overlayTitle.textContent =
    'こちらでお間違いないですか？';


  participantOrganization.textContent =
    result.organization || '';


  participantName.textContent =
    (result.name || '') +
    ' 様';


  participantSeat.textContent =
    result.seat || '';


  overlayMessage.textContent =
    '';


  yesButton.textContent =
    'はい';


  yesButton.disabled =
    false;


  noButton.disabled =
    false;


  buttonRow.style.display =
    'flex';


  showOverlay();
}



/**
 * 受付確定結果
 */
function handleCheckInResult(
  result
) {

  pendingMode =
    '';


  /*
   * 通信自体は成功したが
   * 受付処理が失敗
   */
  if (
    !result ||
    !result.ok
  ) {

    showTemporaryMessage(
      result &&
      result.message
        ? result.message
        : '受付処理に失敗しました。',
      4000
    );


    return;
  }


  /*
   * 本人確認中に
   * 他端末で受付済みになった場合
   */
  if (
    result.duplicate
  ) {

    showParticipantResult(
      '既に受付しております',
      result,
      false
    );


    window.setTimeout(
      function() {

        resumeScanner();

      },
      3000
    );


    return;
  }


  /*
   * =====================================
   * 初回受付成功
   *
   * 5秒間表示
   * =====================================
   */
  const seat =
    result.seat || '';


  overlayTitle.innerHTML =
    '受付が完了しました。<br>' +
    seat +
    'へお座りください';


  participantOrganization.textContent =
    result.organization || '';


  participantName.textContent =
    (result.name || '') +
    ' 様';


  participantSeat.textContent =
    seat;


  buttonRow.style.display =
    'none';


  overlayMessage.textContent =
    '';


  showOverlay();


  /*
   * 高齢の参加者にも
   * 確認しやすいよう5秒
   */
  window.setTimeout(
    function() {

      resumeScanner();

    },
    5000
  );
}



/**
 * 参加者付き結果画面
 */
function showParticipantResult(
  title,
  result,
  showButtons
) {

  overlayTitle.textContent =
    title;


  participantOrganization.textContent =
    result.organization || '';


  participantName.textContent =
    (result.name || '') +
    ' 様';


  participantSeat.textContent =
    result.seat || '';


  buttonRow.style.display =
    showButtons
      ? 'flex'
      : 'none';


  overlayMessage.textContent =
    '';


  showOverlay();
}



/**
 * エラー等を一定時間表示
 */
function showTemporaryMessage(
  message,
  delay
) {

  pendingMode =
    '';


  overlayTitle.textContent =
    message;


  participantOrganization.textContent =
    '';


  participantName.textContent =
    '';


  participantSeat.textContent =
    '';


  buttonRow.style.display =
    'none';


  overlayMessage.textContent =
    '読み取り画面へ戻ります';


  showOverlay();


  window.setTimeout(
    function() {

      resumeScanner();

    },
    delay
  );
}



/**
 * オーバーレイ表示
 */
function showOverlay() {

  overlay.style.display =
    'flex';
}



/**
 * Scannerへ復帰
 *
 * ページ遷移はしない。
 * カメラも取り直さない。
 */
function resumeScanner() {

  clearBridgeTimeout();


  overlay.style.display =
    'none';


  buttonRow.style.display =
    'none';


  overlayMessage.textContent =
    '';


  yesButton.textContent =
    'はい';


  yesButton.disabled =
    false;


  noButton.disabled =
    false;


  currentToken =
    '';


  pendingMode =
    '';


  /*
   * 同じカメラストリームを
   * そのまま再開
   */
  try {

    if (scanner) {

      scanner.resume();
    }


    busy =
      false;


    statusElement.textContent =
      '参加証のQRコードをかざしてください。';


  } catch (error) {

    console.error(
      'Scanner resume:',
      error
    );


    busy =
      false;


    statusElement.textContent =
      'カメラの再開に失敗しました。カメラ切替ボタンを押してください。';
  }
}



/**
 * Apps Script応答待ち
 * タイムアウト
 */
function startBridgeTimeout(
  message
) {

  clearBridgeTimeout();


  bridgeTimeoutId =
    window.setTimeout(
      function() {

        bridgeTimeoutId =
          null;


        pendingMode =
          '';


        showTemporaryMessage(
          message,
          3500
        );

      },
      12000
    );
}



/**
 * タイムアウト解除
 */
function clearBridgeTimeout() {

  if (
    bridgeTimeoutId !== null
  ) {

    window.clearTimeout(
      bridgeTimeoutId
    );


    bridgeTimeoutId =
      null;
  }
}



/**
 * カメラ起動
 */
async function startScanner() {

  statusElement.textContent =
    'カメラを起動しています…';


  scanner =
    new Html5Qrcode(
      'reader'
    );


  try {

    await scanner.start(

      {
        facingMode:
          facingMode
      },

　{
  fps: 10
　},

      onScanSuccess,

      function() {

        /*
         * QRが見つからない状態は正常
         */
      }

    );


    busy =
      false;


    statusElement.textContent =
      '参加証のQRコードをかざしてください。';


  } catch (error) {

    console.error(
      error
    );


    statusElement.textContent =
      'カメラを起動できません。カメラの許可設定を確認してください。';
  }
}



/**
 * カメラ画面へ強制復帰
 *
 * 処理途中で止まった場合でも、
 * ユーザー操作でカメラを再起動する。
 */
async function changeCamera() {

  /*
   * 通信待ちタイマーを解除
   */
  clearBridgeTimeout();


  /*
   * 本人確認・結果画面を閉じる
   */
  overlay.style.display =
    'none';


  buttonRow.style.display =
    'none';


  overlayMessage.textContent =
    '';


  currentToken =
    '';


  pendingMode =
    '';


  busy =
    false;


  statusElement.textContent =
    'カメラを再起動しています…';


  /*
   * いったん現在のScannerを完全終了
   */
  try {

    if (scanner) {

      try {

        await scanner.stop();

      } catch (error) {

        console.log(
          'scanner.stop:',
          error
        );
      }


      try {

        scanner.clear();

      } catch (error) {

        console.log(
          'scanner.clear:',
          error
        );
      }


      scanner =
        null;
    }

  } catch (error) {

    console.error(
      error
    );
  }


  /*
   * 少し待ってから
   * 同じカメラを再起動
   */
  window.setTimeout(
    function() {

      startScanner();

    },
    300
  );
}



/**
 * 対応端末では
 * 画面スリープを防止
 */
async function keepScreenAwake() {

  try {

    if (
      'wakeLock' in navigator
    ) {

      await navigator
        .wakeLock
        .request(
          'screen'
        );
    }

  } catch (error) {

    /*
     * 非対応端末では
     * 何もしない
     */
  }
}



/*
 * =====================================
 * イベント登録
 * =====================================
 */

yesButton.addEventListener(
  'click',
  confirmReception
);


noButton.addEventListener(
  'click',
  cancelReception
);


document
  .getElementById(
    'cameraButton'
  )
  .addEventListener(
    'click',
    changeCamera
  );


window.addEventListener(
  'message',
  receiveBridgeMessage
);


window.addEventListener(
  'load',
  function() {

    keepScreenAwake();

    startScanner();

  }
);


</script>

</body>

</html>
